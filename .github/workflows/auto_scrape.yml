name: Auto Scrape & Sync to PythonAnywhere

# ── Schedule ──────────────────────────────────────────────────────────────────
# Har 2 ghante chalega = 360 runs/month × ~3 min = ~1080 min/month
# Private repo free limit: 2000 min/month — safe hai ✅
on:
  schedule:
    - cron: "0 */2 * * *"   # har 2 ghante: 00:00, 02:00, 04:00 ... UTC

  # Manual trigger bhi allow karo (testing ke liye)
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages to scrape per category (1 or 2)"
        required: false
        default: "1"

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # 20 min se zyada laga toh kill karo

    steps:
      # ── 1. Checkout repo ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history chahiye taaki git push kaam kare
          fetch-depth: 1

      # ── 2. Python setup ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Run scraper ─────────────────────────────────────────────────────
      - name: Run scrape_and_push.py
        env:
          PA_APP_URL:     ${{ secrets.PA_APP_URL }}
          PA_SYNC_TOKEN:  ${{ secrets.PA_SYNC_TOKEN }}
        run: python scrape_and_push.py

      # ── 5. Commit updated jobs.db back to repo ─────────────────────────────
      - name: Commit updated jobs.db and jobs_seed.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.db jobs_seed.json
          # Agar koi change nahi toh commit mat karo (nahi toh error aata)
          git diff --staged --quiet || git commit -m "chore: auto-scrape update [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
