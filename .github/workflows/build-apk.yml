name: 📱 Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: 🔨 Build Release APK with Gradle
        run: |
          cd android-app
          gradle assembleRelease --stacktrace --no-daemon

      - name: 📋 Locate and copy APK
        run: |
          APK_PATH=$(find android-app/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android-app -name "*.apk" | head -1)
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" Pharmly.apk
          ls -lh Pharmly.apk

      - name: 📤 Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pharmly-v3.7.5
          path: Pharmly.apk
          retention-days: 90

      - name: 🚀 Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.7.5
          name: "Pharmly v3.7.5"
          body: |
            ## 📱 Pharmly App v3.7.5

            Download `Pharmly.apk` below and install on your Android device.

            ### What's new in v3.7.5:
            - ⚡ Fixed modal bookmark/save button & state synchronization
            - 🖼️ Added Flyer Download button to Fullscreen HD Lightbox
            - 🛡️ Double-tap back to exit prevents accidental app close
            - 🔔 Fixed background notification receiver drops using goAsync()
            - 🎨 Synchronized dark mode theme to native Android status bar
            - 📱 Fixed top bar layout jump & improved mobile touch targets
            - 🚀 Bundled Lucide icons & Marked library for instant offline loading
          files: Pharmly.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
