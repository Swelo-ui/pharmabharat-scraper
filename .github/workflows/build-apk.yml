name: 📱 Build & Release APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/app/src/**'
      - 'android-app/app/build.gradle'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

# ✅ FIX: Give workflow permission to create GitHub Releases
permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ✅ FIX: Updated to setup-java@v5 (v4 is deprecated)
      - name: ☕ Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Android Build Tools & Platform
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" --sdk_root=$ANDROID_SDK_ROOT
          echo "✅ Android SDK setup complete"

      - name: 🔧 Make gradlew executable
        run: chmod +x android-app/gradlew 2>/dev/null || true

      - name: 🔨 Build Release APK
        run: |
          cd android-app
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: 📋 Locate and copy APK
        run: |
          APK_PATH=$(find android-app -name "*.apk" -path "*/release/*" | head -1)
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" Pharmly.apk
          ls -lh Pharmly.apk

      - name: 📤 Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pharmly-v3.6.0
          path: Pharmly.apk
          retention-days: 90

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.6.0
          name: "Pharmly v3.6.0"
          body: |
            ## 📱 Pharmly App v3.6.0

            Download `Pharmly.apk` below and install on your Android device.

            ### What's new
            - ⚡ Native Doze-Bypass push notifications
            - 🔔 Instant startup & resume push check
            - 🎯 4-Field smart deduplication
            - 🌐 Updated server endpoint
          files: Pharmly.apk
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
